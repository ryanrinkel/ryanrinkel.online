# DigitalOcean App Platform spec — reference copy of how this site is deployed.
#
# The app already exists and is configured through the DO console. This file is
# here so the configuration is written down somewhere you can read it, and so it
# can be reapplied if the app is ever rebuilt from scratch.
#
# WARNING: `doctl apps update <app-id> --spec .do/app.yaml` REPLACES the app's
# whole spec. If the live app has settings not captured here, they are lost.
# Check the live spec first:
#
#   doctl apps list
#   doctl apps spec get <app-id> > live-spec.yaml
#
# and diff it against this file before applying anything.

name: hire-me
region: nyc

static_sites:
  - name: site

    github:
      repo: ryanrinkel/ryanrinkel.online
      branch: main
      deploy_on_push: true

    # Plain static files at the repo root. No build step, nothing to install,
    # so there is no build_command and no output_dir.
    source_dir: /

    index_document: index.html
    error_document: 404.html

domains:
  - domain: hireme.ryanrinkel.online
    type: PRIMARY
